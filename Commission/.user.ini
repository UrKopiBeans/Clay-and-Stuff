; Commission form upload limits (PHP-FPM/CGI hosting, e.g. Hostinger, cPanel).
; See .htaccess in this folder for the explanation. Note: PHP-FPM caches
; .user.ini for a few minutes, changes may take ~5 min to take effect.

upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 50
max_execution_time = 120
max_input_time = 120
